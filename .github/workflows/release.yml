name: Build and Release ScripOx

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js (for Chrome Extension build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Inno Setup
        run: choco install innosetup -y
        shell: powershell

      - name: Extract Tag Version
        id: get_version
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v?(.*)$') {
            $ver = $matches[1]
          } else {
            $ver = "1.0.0"
          }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
        shell: powershell

      - name: Build Chrome Extension
        run: |
          cd ScripOx.Extension
          if (Test-Path package.json) {
            npm ci --ignore-scripts
            npm run build --if-present
          }
        shell: powershell

      - name: Publish ScripOx Desktop (Self-Contained win-x64)
        run: |
          dotnet publish ScripOx.Desktop/ScripOx.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=$env:APP_VERSION `
            -o ./dist/app
        shell: powershell

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Standalone Extractor Backend
        run: |
          cd ScripOx.Extractor
          pip install -r requirements.txt pyinstaller
          python build_backend.py
          if (-not (Test-Path ../dist/app/extractor)) { New-Item -ItemType Directory -Path ../dist/app/extractor -Force | Out-Null }
          Copy-Item dist/ScripOxBackend.exe ../dist/app/extractor/ScripOxBackend.exe -Force
        shell: powershell

      - name: Build Inno Setup Installer
        run: |
          if (-not (Test-Path ./dist/installer)) { New-Item -ItemType Directory -Path ./dist/installer -Force | Out-Null }
          $iscc = @(
            "iscc",
            "C:\Program Files (x86)\Inno Setup 6\iscc.exe",
            "C:\Program Files\Inno Setup 6\iscc.exe"
          ) | Where-Object { (Get-Command $_ -ErrorAction SilentlyContinue) -or (Test-Path $_) } | Select-Object -First 1
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer.iss
        shell: powershell

      - name: Create Portable ZIP & Checksums
        run: |
          Compress-Archive -Path ./dist/app/* -DestinationPath ./dist/ScripOx-v${{ env.APP_VERSION }}-win-x64.zip
          
          $installer = "./dist/installer/ScripOx-Setup-v${{ env.APP_VERSION }}.exe"
          $zip = "./dist/ScripOx-v${{ env.APP_VERSION }}-win-x64.zip"
          $iHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash
          $zHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          
          @"
          $iHash  ScripOx-Setup-v${{ env.APP_VERSION }}.exe
          $zHash  ScripOx-v${{ env.APP_VERSION }}-win-x64.zip
          "@ | Out-File -FilePath ./dist/SHA256SUMS.txt -Encoding utf8
        shell: powershell

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "ScripOx CRM Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./dist/installer/ScripOx-Setup-v${{ env.APP_VERSION }}.exe
            ./dist/ScripOx-v${{ env.APP_VERSION }}-win-x64.zip
            ./dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
