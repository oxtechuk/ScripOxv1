<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Extract Map</title>
  <link rel="stylesheet" href="leaflet.css"/>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(JSON.stringify({ action: 'jsError', message: msg + ' (' + url + ':' + line + ')' }));
      }
    };
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0F172A; color: #0F172A; height: 100vh; }
    #map { height: 100vh; width: 100vw; }
    .custom-popup .leaflet-popup-content-wrapper {
      background: #0F172A;
      color: #F8FAFC;
      border-radius: 8px;
      padding: 6px;
      border: 1px solid #334155;
    }
    .custom-popup .leaflet-popup-tip { background: #0F172A; }
    .poi-title { font-weight: bold; font-size: 13px; color: #CEF22C; }
    .poi-phone { font-size: 11px; color: #94A3B8; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="leaflet.js"></script>
  <script>
    // Initial center: Düsseldorf, Germany
    const map = L.map('map', { zoomControl: true }).setView([51.2277, 6.7735], 12);
    
    // Free, reliable tile layers
    const osmStandard = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri, Maxar',
      maxZoom: 18,
    });

    const cartoVoyager = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 19,
      attribution: '&copy; CARTO &copy; OpenStreetMap'
    });

    const cartoDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 19,
      attribution: '&copy; CARTO &copy; OpenStreetMap'
    });

    L.control.layers({
      "🌐 OpenStreetMap": osmStandard,
      "🛰️ Satellite": esriSatellite,
      "🗺️ Voyager Clean": cartoVoyager,
      "🌙 Dark Modern": cartoDark
    }, null, { position: 'topright' }).addTo(map);

    let centerMarker = L.marker([51.2277, 6.7735], { draggable: true }).addTo(map);
    centerMarker.bindTooltip("Center Search Point", { permanent: false, direction: 'top' });

    let radiusCircle = L.circle([51.2277, 6.7735], {
      color: '#0F172A',
      fillColor: '#CEF22C',
      fillOpacity: 0.25,
      weight: 2,
      radius: 5000
    }).addTo(map);

    centerMarker.on('drag', function(e) {
      const pos = e.target.getLatLng();
      radiusCircle.setLatLng(pos);
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(JSON.stringify({ type: 'marker_moved', lat: pos.lat, lng: pos.lng }));
      }
    });

    let leadsGroup = L.layerGroup().addTo(map);

    // Called from C# WPF
    window.updateArea = function(lat, lng, radius_km) {
      const radius_m = radius_km * 1000;
      const latlng = [lat, lng];
      
      centerMarker.setLatLng(latlng);
      radiusCircle.setLatLng(latlng);
      radiusCircle.setRadius(radius_m);
      
      map.fitBounds(radiusCircle.getBounds(), { padding: [20, 20] });
    };

    // Native WebView2 message handler for rock-solid JSON transfer without JS injection errors
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', function(e) {
        try {
          const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
          if (!data) return;
          if (data.action === 'setLeads' && Array.isArray(data.leads)) {
            renderLeads(data.leads);
          } else if (data.action === 'updateArea') {
            window.updateArea(data.lat, data.lng, data.radius_km);
          }
        } catch(err) {
          console.error("Error processing webview message:", err);
        }
      });
    }

    function renderLeads(leads) {
      leadsGroup.clearLayers();
      if (!Array.isArray(leads)) return;
      leads.forEach(lead => {
        if (lead && lead.lat && lead.lng) {
          const m = L.circleMarker([lead.lat, lead.lng], {
            radius: 6,
            fillColor: '#CEF22C',
            color: '#0F172A',
            weight: 2,
            fillOpacity: 0.95
          });
          const safeName = (lead.name || 'Unknown Business').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const safePhone = (lead.phone && lead.phone !== 'N/A' ? `<div class="poi-phone">📞 ${lead.phone.replace(/</g, '&lt;')}</div>` : '');
          const safeAddr = (lead.address ? `<div style="font-size:11px; color:#CBD5E1; margin-top:2px;">📍 ${lead.address.replace(/</g, '&lt;')}</div>` : '');
          m.bindPopup(`<div class="custom-popup"><div class="poi-title">${safeName}</div>${safePhone}${safeAddr}</div>`);
          leadsGroup.addLayer(m);
        }
      });
    }

    // Called from C# WPF when leads are extracted
    window.setLeads = function(leadsJson) {
      try {
        const leads = typeof leadsJson === 'string' ? JSON.parse(leadsJson) : leadsJson;
        renderLeads(leads);
      } catch(err) {
        console.error("Failed to render leads:", err);
      }
    };
  </script>
</body>
</html>
